<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Compatibilité Console / Hack</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<h1>Vérifier la compatibilité d'un hack console</h1>

<div class="box">

    <label for="console">Console :</label>
    <select id="console">
        <option value="">-- Sélectionner une console --</option>
        {% for c in consoles %}
            <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
    </select>

    <label for="model">Modèle :</label>
    <select id="model">
        <option value="">-- Choisir une console d'abord --</option>
    </select>

    <button id="checkBtn">Vérifier la compatibilité</button>

</div>

<h2 id="result"></h2>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
